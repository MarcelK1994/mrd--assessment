<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Food Options</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="masthead">
        <p class="eyebrow">Food delivery catalogue</p>
        <h1>Browse Food Options</h1>
      </header>

      <form id="search-form" class="search-form">
        <label for="search-input">Search</label>
        <div class="search-row">
          <input id="search-input" type="search" placeholder="Search for burgers, pizza..." />
          <button type="submit">Search</button>
        </div>
      </form>

      <section class="controls" aria-label="Search filters">
        <label>
          Category
          <select id="category-filter">
            <option value="">All categories</option>
          </select>
        </label>

        <label>
          Sort
          <select id="sort-select">
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </label>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
